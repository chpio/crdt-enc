name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # the fast checks that don't compile, in parallel to the test job. Each runs even if one before
  # failed, so a run reports all of them.
  check:
    runs-on: ubuntu-latest
    # built in the git/images repo, meant to float like in the test job
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust:latest # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - if: ${{ !cancelled() }}
        run: cargo deny --locked check
      - if: ${{ !cancelled() }}
        run: cargo machete
      - if: ${{ !cancelled() }}
        run: typos
      # both only look into .github/workflows on their own
      - if: ${{ !cancelled() }}
        run: actionlint .gitea/workflows/*.yaml
      - if: ${{ !cancelled() }}
        run: zizmor --offline .gitea/workflows/*.yaml

  test:
    runs-on: ubuntu-latest
    # built in the git/images repo
    # The image runs rustc through sccache. Its storage (SCCACHE_REDIS_ENDPOINT and
    # SCCACHE_REDIS_PASSWORD) comes from the runner for every job; don't set it here, an empty
    # value would override it. The image is meant to float: it's rebuilt with the current toolchain
    # and tools every week.
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust:latest # zizmor: ignore[unpinned-images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo clippy --all-targets --locked -- -D warnings
      # only the doctests here: cargo-llvm-cov skips them on stable, and runs every other test below
      - run: cargo test --doc --locked
      - run: cargo cov --locked --fail-under-lines 97
      # reuses the profile data of the run above instead of running the tests again
      - run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov report --lcov --output-path target/llvm-cov/lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov
          path: target/llvm-cov/lcov.info
      - run: sccache --show-stats
        if: always()
