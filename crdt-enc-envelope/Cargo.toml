[package]
name = "crdt-enc-envelope"
version = "0.1.0"
authors = ["Thomas Heck <t@b128.net>"]
edition = "2024"

[dependencies]
crdts = "7"
rand = { version = "0.10", features = ["thread_rng"] }
anyhow = "1"
futures = "0.3"
serde = "1"
rmp-serde = "1"
serde_bytes = "0.11"
uuid = "1"
async-trait = "0.1"
dyn-clone = "1"
agnostik = "0.2"
phf = { version = "0.13", features = ["macros"] }

[dependencies.crdt-enc]
path = "../crdt-enc"

[dependencies.chacha20poly1305]
version = "0.10"
features = ["std"]

[dev-dependencies]
crdt-enc-tokio = { path = "../crdt-enc-tokio" }
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"

[dev-dependencies.agnostik]
version = "0.2"
features = ["runtime_tokio1"]
