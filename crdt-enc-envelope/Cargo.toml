[package]
name = "crdt-enc-envelope"
version = "0.1.0"
authors = ["Thomas Heck <t@b128.net>"]
edition = "2024"

[dependencies]
crdts = "7"
rand = { version = "0.10", features = ["thread_rng"] }
anyhow = "1"
futures = "0.3"
serde = "1"
rmp-serde = "1"
serde_bytes = "0.11"
uuid = "1"
dyn-clone = "1"
phf = { version = "0.14", features = ["macros"] }
chacha20poly1305 = "0.11"
zeroize = "1.9"
tokio = { version = "1", features = ["rt"] }

[dependencies.crdt-enc]
path = "../crdt-enc"

[dev-dependencies]
crdt-enc-tokio = { path = "../crdt-enc-tokio" }
tokio = { version = "1", features = ["macros"] }
tempfile = "3"
