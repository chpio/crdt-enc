[workspace]

resolver = "3"

members = [
    "crdt-enc",
    "crdt-enc-envelope",
    "crdt-enc-password",
    "crdt-enc-tokio",
    "examples/*",
]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
# UUID literals are written in their canonical 8-4-4-4-12 grouping, which this lint rejects.
unusual_byte_groupings = "allow"
